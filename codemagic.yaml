workflows:
  ios-release:
    name: iOS release build
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Force Podfile generation and set platform
        script: |
          cd ios
          pod init
          sed -i '' 's/# platform :ios, '\''12.0\''/platform :ios, '\''15.5\''/g' Podfile
          cd ..
      - name: Build iOS unsigned ipa via Payload
        script: |
          # 1. Bangun konfigurasi bawaan flutter tanpa memanggil kompilasi Xcode
          flutter build ios --release --config-only
          
          # 2. Masuk ke direktori iOS
          cd ios
          
          # 3. Paksa kompilasi Xcode secara manual dengan bypass mutlak
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO EXPANDED_CODE_SIGN_IDENTITY=""
          
          # 4. Masuk ke direktori hasil build xcodebuild
          cd build/Release-iphoneos
          
          # 5. Buat struktur Payload
          mkdir -p Payload
          
          # 6. Pindahkan Runner.app ke dalam Payload
          mv Runner.app Payload/
          
          # 7. Pastikan folder target artifact flutter ada
          mkdir -p ../../../build/ios
          
          # 8. Zip struktur tersebut menjadi IPA dan letakkan di tempat yang dibaca Codemagic
          zip -qr ../../../build/ios/AndalanTools.ipa Payload
          
          # Debug output
          cd ../../..
          ls -la build/ios/
    artifacts:
      - build/ios/AndalanTools.ipa


