workflows:
  ios-release:
    name: iOS release build
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Force Podfile generation and set platform
        script: |
          cd ios
          pod init
          sed -i '' 's/# platform :ios, '\''12.0\''/platform :ios, '\''15.5\''/g' Podfile
          cd ..
      - name: Build iOS unsigned ipa via Payload
        script: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/Payload
          mv build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qr AndalanTools.ipa Payload
    artifacts:
      - build/ios/*.ipa


