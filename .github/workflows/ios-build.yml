name: Build iOS (IPA & Simulator)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA & Simulator Bundle
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true


      - name: Install dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      - name: Build iOS Simulator Bundle
        run: |
          flutter build ios --simulator --no-codesign
          cd build/ios/iphonesimulator
          zip -r -q ../../../AndalanTools-simulator.zip Runner.app
          cd ../../..
          ls -lh AndalanTools-simulator.zip

      - name: Build iOS Unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q ../../../AndalanTools.ipa Payload
          cd ../../..
          ls -lh AndalanTools.ipa

      - name: Upload iOS Simulator Bundle (Appetize.io Testing)
        uses: actions/upload-artifact@v4
        with:
          name: AndalanTools-simulator
          path: AndalanTools-simulator.zip
          retention-days: 14

      - name: Upload Unsigned IPA (SideStore / Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: AndalanTools-ipa
          path: AndalanTools.ipa
          retention-days: 14

      - name: Summary & Next Steps
        run: |
          echo "### 🚀 iOS Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Cara Testing:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Di Laptop (Browser via Appetize.io):**" >> $GITHUB_STEP_SUMMARY
          echo "   - Download artefak \`AndalanTools-simulator\`." >> $GITHUB_STEP_SUMMARY
          echo "   - Buka [Appetize.io Upload](https://appetize.io/upload) dan upload file zip tersebut." >> $GITHUB_STEP_SUMMARY
          echo "   - Nikmati simulasi iPhone interaktif langsung dari browser." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Di iPhone Fisik (Sideloading):**" >> $GITHUB_STEP_SUMMARY
          echo "   - Download artefak \`AndalanTools-ipa\`." >> $GITHUB_STEP_SUMMARY
          echo "   - Sideload menggunakan SideStore, AltStore, atau Sideloadly." >> $GITHUB_STEP_SUMMARY
