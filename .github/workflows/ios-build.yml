name: Build Multiplatform (iOS & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (IPA & Simulator)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install
          cd ..

      - name: Build iOS Simulator Bundle
        run: |
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -q ../../../AndalanTools-simulator.zip Runner.app
          cd ../../..
          ls -lh AndalanTools-simulator.zip

      - name: Build iOS Unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q ../../../AndalanTools.ipa Payload
          cd ../../..
          ls -lh AndalanTools.ipa

      - name: Upload iOS Simulator Bundle (Appetize.io Testing)
        uses: actions/upload-artifact@v4
        with:
          name: AndalanTools-simulator
          path: AndalanTools-simulator.zip
          retention-days: 14

      - name: Upload Unsigned IPA (SideStore / Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: AndalanTools-ipa
          path: AndalanTools.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AndalanTools.apk
          ls -lh AndalanTools.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AndalanTools-apk
          path: AndalanTools.apk
          retention-days: 14
